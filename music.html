  <meta name="theme-color" content="#0c0e14">
  <title>FretDrop — しちゅーず開発室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316130f'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23c5362b' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sheet">
    <header class="topbar">
      <a class="back" href="index.html">一覧へ</a>
    </header>
    <div class="mast mast--music">
      <img src="assets/music-icon.svg" width="72" height="72" alt="">
      <div>
        <h1>FretDrop</h1>
        <p class="en">ギター練習</p>
        <span class="badge badge-soon">公開準備中</span>
      </div>
    </div>
    <p class="lead">ギターの練習アプリです。曲を選んで弾き、マイクで音程が合っているかを見ます。</p>
    <section class="scene">
      <img src="assets/shots/music-home.jpg" alt="初心者モード、速度、テンポ、曲のレコード、練習とデモのボタン">
      <p>最初の画面です。左で初心者モード、ノーツの速度、テンポを決めます。右のレコードを回して曲を選び、「練習」で自分で弾くか、「デモ」でお手本を聴きます。MusicXML を読み込むと、書き出した自分の譜面でも同じように始められます。</p>
    </section>
    <p class="fine">インストール用のリンクは、まだ用意していません。</p>
  </div>
